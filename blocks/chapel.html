<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Science Block</title>

<link rel="stylesheet"
href="../css/science.css">

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

</head>

<body>

<!-- Loading -->

<div id="loader">

<div class="spinner"></div>

<h2>Loading Science Block...</h2>

</div>

<!-- Transition Video -->

<div id="videoContainer">

<video
id="transitionVideo"
playsinline
muted>

</video>

<div id="videoOverlay">

<h1 id="videoTitle">
Science Block
</h1>

</div>

</div>

<!-- Main -->

<div id="viewer">

<!-- Sidebar -->

<div id="sidebar">

<div class="sidebarHeader">

<h2>Science Block</h2>

<p>Panorama Locations</p>

</div>

<div id="locationList">

<div
class="location active"
data-id="entrance">

<img
src="../thumbs/science/entrance.jpg">

<span>Entrance</span>

</div>

<div
class="location"
data-id="corridor">

<img
src="../thumbs/science/corridor.jpg">

<span>Main Corridor</span>

</div>

<div
class="location"
data-id="physics">

<img
src="../thumbs/science/physics.jpg">

<span>Physics Lab</span>

</div>

<div
class="location"
data-id="chemistry">

<img
src="../thumbs/science/chemistry.jpg">

<span>Chemistry Lab</span>

</div>

<div
class="location"
data-id="computer">

<img
src="../thumbs/science/computer.jpg">

<span>Computer Lab</span>

</div>

</div>

</div>

<!-- Panorama -->

<div id="panoContainer">

<a-scene
embedded
vr-mode-ui="enabled:true"
loading-screen="enabled:false">

<a-assets>

<img id="entrance"
src="../images/science/entrance.jpg">

<img id="corridor"
src="../images/science/corridor.jpg">

<img id="physics"
src="../images/science/physics.jpg">

<img id="chemistry"
src="../images/science/chemistry.jpg">

<img id="computer"
src="../images/science/computer.jpg">

</a-assets>

<a-sky
id="sky"
src="#entrance">
</a-sky>

<a-camera
position="0 1.6 0"
look-controls="magicWindowTrackingEnabled:true">

<a-cursor
color="white">
</a-cursor>

</a-camera>

</a-scene>

</div>

</div>

<script src="../js/science.js"></script>

</body>

</html>
